      const fol = x.f ? ` · ${x.f.toLocaleString('pl')} obs.` : '';
      row.innerHTML = `
        <input type="checkbox" ${state[x.ig] ? 'checked' : ''}>
        <div class="info"><div class="nm">${x.n}</div>
        <div class="meta">@${x.ig} · ${x.c}${fol}</div></div>
        <a class="btn ig" href="https://instagram.com/${x.ig}" target="_blank">IG</a>
        <button class="btn cp">Kopiuj DM</button>`;
      row.querySelector('input').onchange = e => {
        state[x.ig] = e.target.checked; if (!e.target.checked) delete state[x.ig];
        save(); render();
      };
      row.querySelector('.cp').onclick = async e => {
        const txt = DM[x.niche].replaceAll('[NAZWA]', x.n);
        try { await navigator.clipboard.writeText(txt); }
        catch (_) {
          const t = document.createElement('textarea'); t.value = txt;
          document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
        }
        e.target.textContent = 'Skopiowano!'; e.target.classList.add('ok');
        setTimeout(() => { e.target.textContent = 'Kopiuj DM'; e.target.classList.remove('ok'); }, 1500);
      };
      list.appendChild(row);
    }
  }
  const done = DATA.filter(x => state[x.ig]).length;
  document.getElementById('prog').textContent = `${done}/${DATA.length}`;
  document.querySelector('#bar > div').style.width = (100 * done / DATA.length) + '%';
}
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
render();
</script></body></html>
