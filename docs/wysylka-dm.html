<style>
  :root {

    --line: #e5e5e2; --accent: #2563eb; --accent-hover: #1d4ed8;
    --navy: #0e1a33; --success: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
         background: var(--canvas); color: var(--ink);
         -webkit-font-smoothing: antialiased; }
  .tab { font-variant-numeric: tabular-nums; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92);
           backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .head-in { max-width: 720px; margin: 0 auto; padding: 16px 20px 14px;
             display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
  .brand b { font-size: 15px; letter-spacing: -0.01em; }
  .brand span { font-size: 12px; color: var(--ink2); }
  .count { text-align: right; }
  .count b { font-size: 20px; letter-spacing: -0.02em; }
  .count span { display: block; font-size: 11px; color: var(--ink2);
                text-transform: uppercase; letter-spacing: .07em; }
  .seg { display: flex; background: #ececea; border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--ink2); font-size: 13px;
                font-weight: 500; padding: 6px 13px; border-radius: 7px; cursor: pointer;
                transition: color .15s; font-family: inherit; }
  .seg button.on { background: var(--surface); color: var(--ink); font-weight: 600;
                   box-shadow: 0 1px 3px rgba(23,23,23,.12); }
  #bar { height: 3px; background: transparent; }
  #bar div { height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

  main { max-width: 720px; margin: 0 auto; padding: 8px 20px 80px; }
  .sec { margin-top: 32px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between;
           padding: 0 4px 10px; }
  .sec-h h2 { font-size: 12px; font-weight: 600; color: var(--ink2);
              text-transform: uppercase; letter-spacing: .09em; }
  .sec-h .tab { font-size: 12px; color: var(--ink2); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
          overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 13px 16px;
         border-top: 1px solid var(--line); transition: background .15s; }
  .row:first-child { border-top: 0; }
  .row:hover { background: #fafaf8; }
  .row.done .nm { color: var(--ink2); text-decoration: line-through;
                  text-decoration-color: rgba(107,107,107,.5); }
  .row.done { background: #fbfbfa; }
  .row.done .meta { opacity: .6; }

  .chk { position: relative; width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; }
  .chk input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .chk .box { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #d1d1cd;
              display: grid; place-items: center; transition: all .15s; background: var(--surface); }
  .chk .box svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 3; fill: none;
                  opacity: 0; transform: scale(.6); transition: all .15s; }
  .chk input:checked + .box { background: var(--success); border-color: var(--success); }
  .chk input:checked + .box svg { opacity: 1; transform: scale(1); }
  .chk:hover .box { border-color: var(--accent); }
  .chk input:checked:hover + .box { border-color: var(--success); }

  .info { flex: 1; min-width: 0; }
  .nm { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  .meta { font-size: 12.5px; color: var(--ink2); margin-top: 1px; }

  .act { display: flex; gap: 8px; }
  .btn { font-family: inherit; font-size: 13px; font-weight: 600; border-radius: 9px;
         padding: 7px 12px; cursor: pointer; border: 1px solid transparent;
         transition: all .15s; text-decoration: none; display: inline-flex;
         align-items: center; white-space: nowrap; }
  .btn-ig { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn-ig:hover { border-color: #c9c9c5; background: #fafaf8; }
  .btn-cp { background: var(--navy); color: #fff; }
  .btn-cp:hover { background: #1a2c52; }
  .btn-cp.ok { background: var(--success); animation: pop .25s ease; }
  @keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

  .empty { text-align: center; color: var(--ink2); font-size: 14px; padding: 60px 0; }
  @media (max-width: 560px) {
    .head-in { padding: 12px 14px 10px; gap: 10px; flex-wrap: wrap; }
    main { padding: 4px 10px 80px; }
    .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn { padding: 7px 10px; }
  }

const KEY = 'scanova-dm-2026-08';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
let filter = 'all';
const CHECK_SVG = '<svg viewBox="0 0 16 16"><path d="M2.5 8.5 6 12l7.5-8"/></svg>';

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function fmt(n) { return n.toLocaleString('pl-PL'); }

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const byNiche = {};
  for (const x of DATA) (byNiche[x.niche] ||= []).push(x);
  let shown = 0;
  for (const niche of Object.keys(byNiche)) {
    const all = byNiche[niche];
    const items = all.filter(x => filter === 'all' || (filter === 'done') === !!state[x.ig]);
    if (!items.length) continue;
    shown += items.length;
    const doneN = all.filter(x => state[x.ig]).length;
    const sec = document.createElement('section');
    sec.className = 'sec';
    sec.innerHTML = `<div class="sec-h"><h2>${LABEL[niche]}</h2>
      <span class="tab">${doneN} / ${all.length}</span></div>`;
    const card = document.createElement('div');
    card.className = 'card';
    for (const x of items) {
      const row = document.createElement('div');
      row.className = 'row' + (state[x.ig] ? ' done' : '');
      const fol = x.f ? ` · ${fmt(x.f)} obs.` : '';
      row.innerHTML = `
        <label class="chk"><input type="checkbox" ${state[x.ig] ? 'checked' : ''}>
          <span class="box">${CHECK_SVG}</span></label>
        <div class="info"><div class="nm">${x.n}</div>
          <div class="meta">@${x.ig} · ${x.c}${fol}</div></div>
        <div class="act">
          <a class="btn btn-ig" href="https://instagram.com/${x.ig}" target="_blank">Profil</a>
          <button class="btn btn-cp">Kopiuj DM</button>
        </div>`;
      row.querySelector('input').onchange = e => {
        if (e.target.checked) state[x.ig] = 1; else delete state[x.ig];
        save(); render();
      };
      row.querySelector('.btn-cp').onclick = async e => {
        const txt = DM[x.niche].replaceAll('[NAZWA]', x.n);
        try { await navigator.clipboard.writeText(txt); }
        catch (_) {
          const t = document.createElement('textarea'); t.value = txt;
          document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
        }
        const b = e.target;
        b.textContent = 'Skopiowano'; b.classList.add('ok');
        setTimeout(() => { b.textContent = 'Kopiuj DM'; b.classList.remove('ok'); }, 1400);
      };
      card.appendChild(row);
    }
    sec.appendChild(card);
    list.appendChild(sec);
  }
  if (!shown) {
    list.innerHTML = `<div class="empty">${filter === 'done'
      ? 'Nic jeszcze nie wysłane.' : 'Wszystko wysłane 🎉'}</div>`;
  }
  const done = DATA.filter(x => state[x.ig]).length;
  document.getElementById('prog').textContent = `${done} / ${DATA.length}`;
  document.querySelector('#bar div').style.width = (100 * done / DATA.length) + '%';
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {

});
