<!doctype html>
<html lang="pl" data-composition-variables='[
  {"id":"bg","type":"color","label":"Tło","default":"#fcfcfa"},
  {"id":"compact","type":"boolean","label":"Wersja kompaktowa (nakładka na nagranie)","default":false},
  {"id":"t2","type":"number","label":"Czas: pieczątka (s)","default":5},
  {"id":"t3","type":"number","label":"Czas: nagroda (s)","default":10},
  {"id":"t4","type":"number","label":"Czas: opinia (s)","default":14}
]'>
  <head><meta charset="UTF-8" /><title>Scena 2 · karta, pieczątka, nagroda, opinia</title></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; container-type: size; background: var(--bg); color: #1c1c1c; font-family: Montserrat, sans-serif; }
        #s2-label { position: absolute; left: 6cqw; top: 5cqw; font-family: "Space Mono", monospace; font-weight: 700; font-size: 2.6cqw; letter-spacing: .12em; text-transform: uppercase; color: #5d5d62; }
        .s2-step { position: absolute; left: 6cqw; top: 11cqw; font-weight: 900; font-size: 6.2cqw; line-height: 1.05; letter-spacing: -.03em; max-width: 50cqw; opacity: 0; }
        .s2-step em { font-style: normal; color: #1d5fd1; }
        .s2-phone { position: absolute; width: 36cqw; aspect-ratio: 900 / 1272; border-radius: 4cqw; overflow: hidden; box-shadow: 0 3cqw 6cqw rgba(0,0,0,.22); opacity: 0; background: #fff; }
        .s2-phone img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #s2-ph1 { right: 8cqw; top: 22cqw; }
        #s2-ph2 { right: 8cqw; top: 22cqw; }
        #s2-ph3 { right: 8cqw; top: 22cqw; }
        #s2-qr { position: absolute; left: 10cqw; top: 34cqw; width: 22cqw; height: 22cqw; background: #fff; border: .7cqw solid #1c1c1c; border-radius: 2cqw; display: grid; place-items: center; opacity: 0; }
        #s2-qr svg { width: 72%; height: 72%; }
        #s2-wallets { position: absolute; left: 6cqw; top: 60cqw; display: flex; flex-direction: column; gap: 1.4cqw; }
        #s2-wallets span { font-family: "Space Mono", monospace; font-weight: 700; font-size: 2.6cqw; background: #1c1c1c; color: #fff; border-radius: 999px; padding: 1.2cqw 2.4cqw; opacity: 0; align-self: flex-start; }
        #s2-plus { position: absolute; right: 36cqw; top: 30cqw; background: #1f8f3e; color: #fff; font-weight: 900; font-size: 5.4cqw; border-radius: 999px; padding: 1.6cqw 3cqw; box-shadow: 0 2cqw 4cqw rgba(31,143,62,.35); opacity: 0; }
        #s2-burst { position: absolute; right: 26cqw; top: 20cqw; width: 2cqw; height: 2cqw; }
        #s2-burst i { position: absolute; left: 0; top: 0; width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: #f4c542; opacity: 0; }
        #s2-review { position: absolute; left: 6cqw; top: 62cqw; width: 50cqw; background: #fff; border: .5cqw solid #1c1c1c; border-radius: 3cqw; padding: 3cqw; box-sizing: border-box; box-shadow: .8cqw 1.2cqw 0 rgba(0,0,0,.08); opacity: 0; }
        #s2-review b { display: block; font-size: 3.6cqw; margin-bottom: 1cqw; }
        #s2-review .st { display: flex; gap: .6cqw; margin-bottom: 1.6cqw; }
        #s2-review .st span { font-size: 5cqw; color: #d9d9d4; display: inline-block; }
        #s2-review .btn { background: #1f8f3e; color: #fff; font-weight: 700; font-size: 3cqw; padding: 1.4cqw 2.4cqw; border-radius: 1.6cqw; display: inline-block; }
        #s2-count { position: absolute; right: 8cqw; bottom: 6cqw; text-align: right; font-weight: 900; font-size: 9cqw; color: #1f8f3e; letter-spacing: -.04em; opacity: 0; }
        #s2-count small { display: block; font-family: "Space Mono", monospace; font-weight: 400; font-size: 2.4cqw; color: #5d5d62; letter-spacing: 0; }
        #root.compact { background: transparent; }
        #root.compact .s2-step, #root.compact #s2-label { color: #fff; text-shadow: 0 .3cqw 1.2cqw rgba(0,0,0,.6); }
        #root.compact .s2-step em { color: #9cc0ff; }
        #root.compact #s2-count { color: #fff; text-shadow: 0 .3cqw 1.2cqw rgba(0,0,0,.6); }
      </style>

      <div id="root" data-composition-id="s2-karta" data-width="1080" data-height="960">
        <div id="s2-label">Jak to działa</div>
        <div class="s2-step" id="s2-t1">Skan kodu QR → karta <em>w portfelu</em></div>
        <div class="s2-step" id="s2-t2">Każda wizyta = <em>pieczątka</em></div>
        <div class="s2-step" id="s2-t3">Po kilku: <em>nagroda</em></div>
        <div class="s2-step" id="s2-t4">Po wizycie: prośba o <em>opinię w Google</em></div>

        <div id="s2-qr"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#1c1c1c"><rect x="6" y="6" width="30" height="30"/><rect x="64" y="6" width="30" height="30"/><rect x="6" y="64" width="30" height="30"/><rect x="44" y="6" width="8" height="8"/><rect x="44" y="22" width="8" height="8"/><rect x="44" y="44" width="12" height="12"/><rect x="64" y="44" width="8" height="8"/><rect x="80" y="44" width="14" height="8"/><rect x="44" y="64" width="8" height="12"/><rect x="60" y="60" width="8" height="8"/><rect x="76" y="64" width="18" height="8"/><rect x="60" y="80" width="12" height="14"/><rect x="80" y="80" width="14" height="14"/></g><g fill="#fff"><rect x="13" y="13" width="16" height="16"/><rect x="71" y="13" width="16" height="16"/><rect x="13" y="71" width="16" height="16"/></g><g fill="#1c1c1c"><rect x="17" y="17" width="8" height="8"/><rect x="75" y="17" width="8" height="8"/><rect x="17" y="75" width="8" height="8"/></g></svg></div>
        <div id="s2-wallets"><span>Apple Wallet</span><span>Google Wallet</span></div>

        <div class="s2-phone" id="s2-ph1"><img src="assets/karta-wallet.png" alt="Karta w Wallecie" /></div>
        <div class="s2-phone" id="s2-ph2"><img src="assets/pieczatka.png" alt="Pieczątka" /></div>
        <div class="s2-phone" id="s2-ph3"><img src="assets/nagroda.png" alt="Nagroda" /></div>
        <div id="s2-plus">+1</div>
        <div id="s2-burst"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

        <div id="s2-review"><b>Podobało się?</b><div class="st"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><span class="btn">Zostaw opinię w Google</span></div>
        <div id="s2-count">+1 opinia<small>i tak setki razy w miesiącu</small></div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("root");
          const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          if (vars.compact === true || vars.compact === "true") root.classList.add("compact");
          const tl = gsap.timeline({ paused: true });
          const up = { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" };
          const num = (v, d) => (Number.isFinite(+v) && +v > 0 ? +v : d);
          const t2 = num(vars.t2, 5), t3 = num(vars.t3, 10), t4 = num(vars.t4, 14);
          // Krok 1: skan → karta w portfelu (0–5 s)
          tl.fromTo("#s2-t1", { opacity: 0, y: 24 }, up, 0.2);
          tl.fromTo("#s2-qr", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.8);
          tl.fromTo("#s2-ph1", { opacity: 0, y: 260, rotation: 4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.9, ease: "power3.out" }, 1.4);
          tl.fromTo("#s2-wallets span", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.18 }, 2.4);
          // Krok 2: pieczątka (5–10 s)
          tl.to("#s2-t1", { opacity: 0, y: -16, duration: 0.3 }, t2);
          tl.to(["#s2-qr", "#s2-wallets span"], { opacity: 0, duration: 0.3 }, t2);
          tl.fromTo("#s2-t2", { opacity: 0, y: 24 }, up, t2 + 0.2);
          tl.fromTo("#s2-ph2", { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, t2 + 0.35);
          tl.to("#s2-ph1", { opacity: 0, x: -60, duration: 0.3 }, t2);
          tl.fromTo("#s2-plus", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(3)" }, t2 + 1.4);
          tl.to("#s2-plus", { y: -40, opacity: 0, duration: 0.6, ease: "power2.in" }, t2 + 3.0);
          // Krok 3: nagroda (10–14 s)
          tl.to("#s2-t2", { opacity: 0, y: -16, duration: 0.3 }, t3);
          tl.fromTo("#s2-t3", { opacity: 0, y: 24 }, up, t3 + 0.2);
          tl.fromTo("#s2-ph3", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, t3 + 0.4);
          tl.to("#s2-ph2", { opacity: 0, x: -60, duration: 0.3 }, t3);
          const burst = document.querySelectorAll("#s2-burst i");
          burst.forEach((b, i) => {
            const a = (i / burst.length) * Math.PI * 2;
            tl.fromTo(b, { opacity: 1, x: 0, y: 0, scale: 1 }, { x: Math.cos(a) * 110, y: Math.sin(a) * 110, scale: 0.2, opacity: 0, duration: 0.9, ease: "power2.out" }, t3 + 1.0);
          });
          // Krok 4: prośba o opinię (14–20 s)
          tl.to("#s2-t3", { opacity: 0, y: -16, duration: 0.3 }, t4);
          tl.fromTo("#s2-t4", { opacity: 0, y: 24 }, up, t4 + 0.2);
          tl.fromTo("#s2-review", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, t4 + 0.6);
          tl.to("#s2-review .st span", { color: "#f4c542", duration: 0.2, stagger: 0.12 }, t4 + 1.3);
          tl.fromTo("#s2-review .btn", { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, t4 + 2.2);
          tl.fromTo("#s2-count", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t4 + 3.0);
          window.__timelines["s2-karta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
