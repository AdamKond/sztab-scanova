      <script>
        (function () {
          const root = document.getElementById("root");
          const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          if (vars.compact === true || vars.compact === "true") root.classList.add("compact");
          const tl = gsap.timeline({ paused: true });
          const up = { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" };
          const num = (v, d) => (Number.isFinite(+v) && +v > 0 ? +v : d);
          const tCard = num(vars.tCard, 4.2), tJutro = num(vars.tJutro, 8.2), tFree = num(vars.tFree, 11), tBubble = num(vars.tBubble, 15);
          tl.fromTo("#s4-h", { opacity: 0, y: 24 }, up, 0.2);
          tl.fromTo("#s4-meet", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.0);
          tl.fromTo("#s4-list div", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.5 }, tCard);
          tl.fromTo("#s4-card", { opacity: 0, y: 120, rotation: 3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "power3.out" }, tCard + 0.4);
          // „Twoja kolorystyka”: karta zmienia kolor pod głos
          tl.to("#s4-card", { backgroundColor: "#1f8f3e", duration: 0.6 }, tCard + 0.8);
          tl.to("#s4-card", { backgroundColor: "#d2262e", duration: 0.6 }, tCard + 1.6);
          tl.to("#s4-card", { backgroundColor: "#1c1c1c", duration: 0.6 }, tCard + 2.4);

          tl.fromTo("#s4-bubble span", { opacity: 0 }, { opacity: 1, duration: 0.15, stagger: 0.22 }, tBubble + 0.4);
          tl.fromTo("#s4-logo", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5 }, tBubble + 4.0);
          window.__timelines["s4-cta"] = tl;
